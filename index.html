<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coquí Ventas - Mercado, Bienes Raíces y Empleos en Puerto Rico</title>
    
    <!-- Firebase SDKs (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary-color: #1b4332;
            --accent-color: #d97706;
            --bg-color: #f4f6f4;
            --text-color: #212529;
            --white: #ffffff;
            --gray: #6c757d;
            --light-gray: #e9ecef;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        header {
            background-color: var(--white);
            border-bottom: 1px solid var(--light-gray);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        .btn {
            background-color: var(--light-gray);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-color);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        .btn:hover { opacity: 0.85; }

        .btn-primary {
            background-color: var(--accent-color);
            color: var(--white);
        }

        .main-container {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 2rem;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        aside h3 {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: var(--gray);
            margin-bottom: 1rem;
        }

        .department-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .dept-item {
            background: transparent;
            border: none;
            text-align: left;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text-color);
            transition: background 0.2s;
        }

        .dept-item:hover, .dept-item.active {
            background-color: #e2e8f0;
            font-weight: bold;
            color: var(--primary-color);
        }

        .content-area h2 {
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        .ads-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--white);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--light-gray);
            display: flex;
            flex-direction: column;
        }

        .card-img-wrapper {
            position: relative;
            width: 100%;
            height: 180px;
            background-color: #cbd5e1;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-body {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
        }

        .card-title { font-size: 1.05rem; font-weight: bold; }
        .card-price { font-size: 1.1rem; color: var(--primary-color); font-weight: bold; }
        .card-location { font-size: 0.85rem; color: var(--gray); }

        .card-footer {
            padding: 1rem;
            border-top: 1px solid var(--light-gray);
            background-color: #fafafa;
        }

        .btn-block {
            width: 100%;
            background-color: var(--primary-color);
            color: var(--white);
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active { display: flex; }

        .modal-card {
            background: var(--white);
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            padding: 2rem;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 1rem; right: 1rem;
            background: none; border: none;
            font-size: 1.25rem; cursor: pointer;
            color: var(--gray);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.65rem;
            border: 1px solid var(--light-gray);
            border-radius: 6px;
            font-size: 0.95rem;
        }

        @media(max-width: 768px) {
            .main-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">🐸 Coquí Ventas</div>
        <div class="header-actions">
            <button class="btn">Mi Resume</button>
            <button class="btn">Panel Empleador</button>
            <button class="btn btn-primary" onclick="abrirModal()">+ Publicar</button>
        </div>
    </header>

    <div class="main-container">
        <aside>
            <h3>Departamentos</h3>
            <div class="department-list" id="categoryList">
                <button class="dept-item active" onclick="filtrarCategoria('Todos', this)">Todos los Anuncios</button>
                <button class="dept-item" onclick="filtrarCategoria('De Aquí (Local)', this)">De Aquí (Local)</button>
                <button class="dept-item" onclick="filtrarCategoria('Bienes Raíces', this)">Bienes Raíces</button>
                <button class="dept-item" onclick="filtrarCategoria('Empleos Directos', this)">Empleos Directos</button>
                <button class="dept-item" onclick="filtrarCategoria('Autos y Vehículos', this)">Autos y Vehículos</button>
                <button class="dept-item" onclick="filtrarCategoria('Electrónica y Equipos', this)">Electrónica y Equipos</button>
                <button class="dept-item" onclick="filtrarCategoria('Hogar y Muebles', this)">Hogar y Muebles</button>
                <button class="dept-item" onclick="filtrarCategoria('Servicios Profesionales', this)">Servicios Profesionales</button>
                <button class="dept-item" onclick="filtrarCategoria('Adopción de Mascotas', this)">Adopción de Mascotas</button>
            </div>
        </aside>

        <main class="content-area">
            <h2 id="feedTitle">Explorando Anuncios</h2>
            <div class="ads-grid" id="cardsGrid">
                <p>Cargando anuncios...</p>
            </div>
        </main>
    </div>

    <!-- Modal con Formulario Directo -->
    <div class="modal-overlay" id="publishModal">
        <div class="modal-card">
            <button class="close-btn" onclick="cerrarModal()">&times;</button>
            <h2 style="margin-bottom: 1rem; color: var(--primary-color);">Crear Publicación</h2>
            
            <form id="formPublicar" onsubmit="guardarAnuncio(event)">
                <div class="form-group">
                    <label>Título del Anuncio</label>
                    <input type="text" id="titulo" required placeholder="Ej. iPhone 13, Apartamento...">
                </div>

                <div class="form-group">
                    <label>Departamento / Categoría</label>
                    <select id="categoria" required>
                        <option value="De Aquí (Local)">De Aquí (Local)</option>
                        <option value="Bienes Raíces">Bienes Raíces</option>
                        <option value="Empleos Directos">Empleos Directos</option>
                        <option value="Autos y Vehículos">Autos y Vehículos</option>
                        <option value="Electrónica y Equipos">Electrónica y Equipos</option>
                        <option value="Hogar y Muebles">Hogar y Muebles</option>
                        <option value="Servicios Profesionales">Servicios Profesionales</option>
                        <option value="Adopción de Mascotas">Adopción de Mascotas</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Precio / Salario</label>
                    <input type="text" id="precio" required placeholder="Ej. $450 o $15/hr">
                </div>

                <div class="form-group">
                    <label>Pueblo / Ubicación</label>
                    <input type="text" id="ubicacion" required placeholder="Ej. Bayamón, PR">
                </div>

                <div class="form-group">
                    <label>Foto (Selecciona 1 imagen ligera)</label>
                    <input type="file" id="fotos" accept="image/*">
                </div>

                <div class="form-group">
                    <label>Descripción detallada</label>
                    <textarea id="descripcion" rows="3" placeholder="Detalles del artículo o servicio..."></textarea>
                </div>

                <button type="submit" class="btn-block" id="btnGuardar">Publicar Anuncio</button>
            </form>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBjLjNc7EGKXdCwc-VmI",
            authDomain: "coqui-ventas.firebaseapp.com",
            projectId: "coqui-ventas",
            storageBucket: "coqui-ventas.appspot.com",
            messagingSenderId: "425636251347",
            appId: "1:425636251347:web:b96972a"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let anunciosTotales = [];

        window.onload = function() {
            cargarAnuncios();
        };

        function cargarAnuncios() {
            db.collection("ads").orderBy("createdAt", "desc").onSnapshot(snapshot => {
                anunciosTotales = [];
                snapshot.forEach(doc => {
                    anunciosTotales.push({ id: doc.id, ...doc.data() });
                });
                renderizarTarjetas(anunciosTotales);
            }, error => {
                console.error("Error al cargar de Firestore:", error);
                document.getElementById('cardsGrid').innerHTML = '<p>Error al conectar con la base de datos.</p>';
            });
        }

        function renderizarTarjetas(lista) {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            if (lista.length === 0) {
                grid.innerHTML = '<p>No hay anuncios publicados todavía. ¡Sé el primero en publicar!</p>';
                return;
            }

            lista.forEach(ad => {
                const foto = (ad.fotos && ad.fotos.length > 0) 
                    ? ad.fotos[0] 
                    : 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=500&q=80';

                const cardHTML = `
                    <article class="card">
                        <div class="card-img-wrapper">
                            <img src="${foto}" class="card-img">
                        </div>
                        <div class="card-body">
                            <h3 class="card-title">${ad.titulo}</h3>
                            <div class="card-price">${ad.precio}</div>
                            <div class="card-location">${ad.ubicacion}</div>
                        </div>
                        <div class="card-footer">
                            <button class="btn-block">Ver Detalle</button>
                        </div>
                    </article>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        function filtrarCategoria(cat, elemento) {
            document.querySelectorAll('.dept-item').forEach(el => el.classList.remove('active'));
            elemento.classList.add('active');
            document.getElementById('feedTitle').innerText = cat === 'Todos' ? 'Explorando Anuncios' : cat;

            if (cat === 'Todos') {
                renderizarTarjetas(anunciosTotales);
            } else {
                const filtrados = anunciosTotales.filter(ad => ad.categoria === cat);
                renderizarTarjetas(filtrados);
            }
        }

        async function guardarAnuncio(e) {
            e.preventDefault();
            const btn = document.getElementById('btnGuardar');
            btn.innerText = 'Subiendo anuncio...';
            btn.disabled = true;

            const titulo = document.getElementById('titulo').value;
            const categoria = document.getElementById('categoria').value;
            const precio = document.getElementById('precio').value;
            const ubicacion = document.getElementById('ubicacion').value;
            const descripcion = document.getElementById('descripcion').value;
            const archivoInput = document.getElementById('fotos');

            let fotosURLs = [];

            try {
                if (archivoInput.files && archivoInput.files[0]) {
                    const file = archivoInput.files[0];
                    const base64 = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (evt) => resolve(evt.target.result);
                        reader.readAsDataURL(file);
                    });
                    fotosURLs.push(base64);
                } else {
                    fotosURLs.push('https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=500&q=80');
                }

                await db.collection("ads").add({
                    titulo,
                    categoria,
                    precio,
                    ubicacion,
                    descripcion,
                    fotos: fotosURLs,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("¡Anuncio publicado con éxito!");
                document.getElementById('formPublicar').reset();
                cerrarModal();
            } catch (err) {
                console.error("Error al publicar:", err);
                alert("Ocurrió un error al subir el anuncio.");
            } finally {
                btn.innerText = 'Publicar Anuncio';
                btn.disabled = false;
            }
        }

        function abrirModal() { document.getElementById('publishModal').classList.add('active'); }
        function cerrarModal() { document.getElementById('publishModal').classList.remove('active'); }
    </script>
</body>
</html>
