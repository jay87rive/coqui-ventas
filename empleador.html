<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Empleador - Coquí Ventas</title>
  <style>
    :root {
      --primary: #1b4332;
      --primary-hover: #2d6a4f;
      --accent: #d97706;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
    }

    header {
      background-color: var(--primary);
      color: white;
      padding: 1rem 2rem;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: white;
      text-decoration: none;
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-weight: 600;
    }

    .container {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .header-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .btn-action {
      background-color: var(--primary);
      color: white;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    .table th, .table td {
      text-align: left;
      padding: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .table th {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    .badge {
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .badge-active {
      background: #dcfce7;
      color: #166534;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">🐸 Coquí Ventas</a>
      <a href="index.html" class="btn-back">← Volver al Mercado</a>
    </div>
  </header>

  <main class="container">
    <div class="header-panel">
      <div>
        <h1>💼 Panel de Control de Empleador</h1>
        <p style="color: var(--text-muted);">Gestiona tus vacantes de empleo y candidatos postulados.</p>
      </div>
      <button class="btn-action">+ Publicar Oferta de Empleo</button>
    </div>

    <div class="card">
      <h3>Vacantes Activas</h3>
      <table class="table">
        <thead>
          <tr>
            <th>Título del Puesto</th>
            <th>Ubicación</th>
            <th>Postulados</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Mesero / Mesera (Restaurante)</td>
            <td>San Juan, PR</td>
            <td>5 Candidatos</td>
            <td><span class="badge badge-active">Activa</span></td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

</body>
</html>
