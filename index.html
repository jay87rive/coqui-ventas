<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coquí Ventas - Clasificados de Puerto Rico</title>
  <style>
    :root {
      --primary-color: #2D5A27;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      color: var(--primary-color);
      font-size: 2.2rem;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
    }

    h2 {
      margin-bottom: 15px;
      font-size: 1.4rem;
      color: var(--primary-color);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 1rem;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #1e3d1a;
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .grid-ads {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .ad-card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
    }

    .ad-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background-color: #eee;
    }

    .ad-content {
      padding: 15px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .ad-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .ad-price {
      color: #C85A32;
      font-weight: bold;
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    .ad-info {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 8px;
    }

    .ad-description {
      font-size: 0.9rem;
      margin-bottom: 15px;
      flex-grow: 1;
    }

    .ad-contact {
      display: inline-block;
      text-align: center;
      background-color: #25D366;
      color: white;
      text-decoration: none;
      padding: 8px;
      border-radius: 5px;
      font-weight: bold;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Coquí Ventas 🐸</h1>
      <p>Tu plataforma de clasificados en Puerto Rico</p>
    </header>

    <!-- Formulario de Publicación -->
    <div class="card">
      <h2>Publicar un Anuncio</h2>
      <form id="adForm">
        <div class="form-group">
          <label for="title">Título del artículo / servicio</label>
          <input type="text" id="title" placeholder="Ej. Toyota Corolla 2018" required />
        </div>

        <div class="form-group">
          <label for="price">Precio ($ USD)</label>
          <input type="number" id="price" step="0.01" placeholder="Ej. 1500" required />
        </div>

        <div class="form-group">
          <label for="town">Pueblo</label>
          <select id="town" required>
            <option value="">Selecciona tu pueblo</option>
          </select>
        </div>

        <div class="form-group">
          <label for="phone">Teléfono / WhatsApp</label>
          <input type="tel" id="phone" placeholder="Ej. 7875551234" required />
        </div>

        <div class="form-group">
          <label for="imageInput">Foto del producto (Opcional)</label>
          <input type="file" id="imageInput" accept="image/*" />
        </div>

        <div class="form-group">
          <label for="description">Descripción</label>
          <textarea id="description" placeholder="Escribe los detalles de tu anuncio..."></textarea>
        </div>

        <button type="submit" id="btnSubmit">Publicar Anuncio</button>
      </form>
    </div>

    <!-- Lista de Anuncios -->
    <h2>Anuncios Recientes</h2>
    <div class="grid-ads" id="adsContainer">
      <p>Cargando anuncios...</p>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    // 1. Firebase Config
    const firebaseConfig = {
      projectId: "coqui-ventas"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 2. Municipios PR
    const municipiosPR = [
      "Adjuntas", "Aguada", "Aguadilla", "Aguas Buenas", "Aibonito", "Añasco", "Arecibo", "Arroyo",
      "Barceloneta", "Barranquitas", "Bayamón", "Cabo Rojo", "Caguas", "Camuy", "Canóvanas", "Carolina",
      "Cataño", "Cayey", "Ceiba", "Ciales", "Cidra", "Coamo", "Comerío", "Corozal", "Culebra",
      "Dorado", "Fajardo", "Florida", "Guánica", "Guayama", "Guayanilla", "Guaynabo", "Gurabo",
      "Hatillo", "Hormigueros", "Humacao", "Isabela", "Jayuya", "Juana Díaz", "Juncos", "Lajas",
      "Lares", "Las Marías", "Las Piedras", "Loíza", "Luquillo", "Manatí", "Maricao", "Maunabo",
      "Mayagüez", "Moca", "Morovis", "Naguabo", "Naranjito", "Orocovis", "Patillas", "Peñuelas",
      "Ponce", "Quebradillas", "Rincón", "Río Grande", "Sabana Grande", "Salinas", "San Germán",
      "San Juan", "San Lorenzo", "San Sebastián", "Santa Isabel", "Toa Alta", "Toa Baja",
      "Trujillo Alto", "Utuado", "Vega Alta", "Vega Baja", "Vieques", "Villalba", "Yabucoa", "Yauco"
    ];

    const townSelect = document.getElementById("town");
    municipiosPR.forEach(pueblo => {
      const option = document.createElement("option");
      option.value = pueblo;
      option.textContent = pueblo;
      townSelect.appendChild(option);
    });

    // 3. Subida directa con Filestack (sin necesidad de API Keys ni registros extra)
    async function uploadImage(file) {
      const formData = new FormData();
      formData.append('fileUpload', file);

      const response = await fetch('https://www.filestackapi.com/api/store/S3?key=A5G3C9O5sR4yt1bN2xT83z', {
        method: 'POST',
        body: file
      });

      const data = await response.json();

      if (!response.ok || !data.url) {
        throw new Error('No se pudo procesar la imagen.');
      }

      return data.url;
    }

    // 4. Guardar Anuncio
    const adForm = document.getElementById("adForm");
    const btnSubmit = document.getElementById("btnSubmit");

    adForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      btnSubmit.disabled = true;
      btnSubmit.textContent = "Subiendo y publicando...";

      try {
        const title = document.getElementById("title").value;
        const price = parseFloat(document.getElementById("price").value);
        const town = document.getElementById("town").value;
        const phone = document.getElementById("phone").value;
        const description = document.getElementById("description").value;
        const imageFile = document.getElementById("imageInput").files[0];

        let imageUrl = "";

        if (imageFile) {
          imageUrl = await uploadImage(imageFile);
        }

        await db.collection("ads").add({
          title: title,
          price: price,
          town: town,
          phone: phone,
          description: description,
          imageUrl: imageUrl,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert("¡Anuncio publicado exitosamente!");
        adForm.reset();
      } catch (error) {
        console.error("Detalle del error:", error);
        alert("Error al publicar: " + error.message);
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Publicar Anuncio";
      }
    });

    // 5. Cargar Anuncios
    const adsContainer = document.getElementById("adsContainer");

    db.collection("ads")
      .orderBy("createdAt", "desc")
      .onSnapshot((snapshot) => {
        adsContainer.innerHTML = "";

        if (snapshot.empty) {
          adsContainer.innerHTML = "<p>No hay anuncios publicados aún.</p>";
          return;
        }

        snapshot.forEach((doc) => {
          const ad = doc.data();
          const adCard = document.createElement("div");
          adCard.className = "ad-card";

          const imgSrc = ad.imageUrl || "https://via.placeholder.com/300x200?text=Sin+Imagen";

          adCard.innerHTML = `
            <img src="${imgSrc}" alt="${ad.title}">
            <div class="ad-content">
              <div class="ad-title">${ad.title}</div>
              <div class="ad-price">$${ad.price.toFixed(2)}</div>
              <div class="ad-info">📍 ${ad.town}</div>
              <div class="ad-description">${ad.description || 'Sin descripción.'}</div>
              <a href="https://wa.me/1${ad.phone.replace(/\D/g, '')}" target="_blank" class="ad-contact">Contactar por WhatsApp</a>
            </div>
          `;

          adsContainer.appendChild(adCard);
        });
      }, (error) => {
        console.error("Error al cargar anuncios:", error);
        adsContainer.innerHTML = "<p>Error al cargar los anuncios.</p>";
      });
  </script>
</body>
</html>
