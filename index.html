<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coquí Ventas - Mercado, Bienes Raíces y Empleos en Puerto Rico</title>
    
    <!-- Firebase SDKs (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary-color: #1b4332;
            --accent-color: #d97706;
            --bg-color: #f4f6f4;
            --text-color: #212529;
            --white: #ffffff;
            --gray: #6c757d;
            --light-gray: #e9ecef;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        header {
            background-color: var(--white);
            border-bottom: 1px solid var(--light-gray);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        .btn {
            background-color: var(--light-gray);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-color);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        .btn:hover { opacity: 0.85; }

        .btn-primary {
            background-color: var(--accent-color);
            color: var(--white);
        }

        .main-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        aside {
            background: var(--white);
            padding: 1.2rem;
            border-radius: 8px;
            border: 1px solid var(--light-gray);
            height: fit-content;
            max-height: 85vh;
            overflow-y: auto;
            position: sticky;
            top: 90px;
        }

        aside h3 {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: var(--gray);
            margin-bottom: 1rem;
            letter-spacing: 0.5px;
        }

        .department-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .category-group {
            border-radius: 6px;
            overflow: hidden;
            background: #fafafa;
            border: 1px solid var(--light-gray);
        }

        .dept-item {
            width: 100%;
            background: transparent;
            border: none;
            text-align: left;
            padding: 10px 12px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--text-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .dept-item:hover, .dept-item.active {
            background-color: #e2e8f0;
            color: var(--primary-color);
        }

        .sub-categories {
            display: none;
            flex-direction: column;
            padding: 4px 8px 8px 16px;
            gap: 4px;
            background: var(--white);
            border-top: 1px solid var(--light-gray);
        }

        .category-group.open .sub-categories {
            display: flex;
        }

        .sub-item {
            background: transparent;
            border: none;
            text-align: left;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.88rem;
            color: var(--gray);
            transition: all 0.2s;
        }

        .sub-item:hover, .sub-item.active {
            background-color: var(--bg-color);
            color: var(--primary-color);
            font-weight: bold;
        }

        .content-area h2 {
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        .ads-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--white);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--light-gray);
            display: flex;
            flex-direction: column;
        }

        .card-img-wrapper {
            position: relative;
            width: 100%;
            height: 180px;
            background-color: #cbd5e1;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-body {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
        }

        .card-title { font-size: 1.05rem; font-weight: bold; }
        .card-price { font-size: 1.1rem; color: var(--primary-color); font-weight: bold; }
        .card-location { font-size: 0.85rem; color: var(--gray); }

        .card-footer {
            padding: 1rem;
            border-top: 1px solid var(--light-gray);
            background-color: #fafafa;
        }

        .btn-block {
            width: 100%;
            background-color: var(--primary-color);
            color: var(--white);
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Modales */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active { display: flex; }

        .modal-card {
            background: var(--white);
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            padding: 2rem;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 1rem; right: 1rem;
            background: none; border: none;
            font-size: 1.25rem; cursor: pointer;
            color: var(--gray);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.65rem;
            border: 1px solid var(--light-gray);
            border-radius: 6px;
            font-size: 0.95rem;
        }

        @media(max-width: 768px) {
            .main-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Modal con Formulario de Publicación -->

            <form id="formPublicar" onsubmit="guardarAnuncio(event)">

                    <input type="text" id="titulo" required placeholder="Ej. Café de altura, iPhone 13, Adopción...">
                </div>

                <div class="form-group">
                    <label>Categoría Principal</label>
                    <select id="categoria" required onchange="actualizarSubcategoriasForm()">
                        <option value="De Aquí (Local)">🌱 De Aquí (Local)</option>
                        <option value="Adopción de Animales">🐕 Adopción de Animales</option>
                        <option value="Vehículos y Piezas">🚗 Vehículos y Piezas</option>
                        <option value="Electrónica y Tecnología">💻 Electrónica y Tecnología</option>
                        <option value="Hogar y Enseres">🏠 Hogar y Enseres</option>
                        <option value="Jardín y Exteriores">🌿 Jardín y Exteriores</option>
                        <option value="Bienes Raíces">🏢 Bienes Raíces</option>
                        <option value="Moda y Accesorios">👕 Moda y Accesorios</option>
                        <option value="Deportes y Recreación">⚽ Deportes y Recreación</option>
                        <option value="Bebés y Niños">👶 Bebés y Niños</option>
                        <option value="Negocios y Comercial">📊 Negocios y Comercial</option>
                        <option value="Mascotas y Suministros">🐾 Mascotas y Suministros</option>
                        <option value="Servicios Profesionales">🛠️ Servicios Profesionales</option>

                </div>

                    <input type="text" id="precio" required placeholder="Ej. $45 o Gratis">
                </div>

                    <label>Pueblo / Ubicación</label>
                    <input type="text" id="ubicacion" required placeholder="Ej. Jayuya, PR">
                </div>

                    <input type="file" id="fotos" accept="image/*">
                </div>

                    <label>Descripción detallada</label>
                    <textarea id="descripcion" rows="3" placeholder="Detalles del artículo, producto fresco o mascota..."></textarea>

                <button type="submit" class="btn-block" id="btnGuardar">Publicar Anuncio</button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBjLjNc7EGKXdCwc-VmI",
            authDomain: "coqui-ventas.firebaseapp.com",
            projectId: "coqui-ventas",
            storageBucket: "coqui-ventas.appspot.com",
            messagingSenderId: "425636251347",
            appId: "1:425636251347:web:b96972a"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let anunciosTotales = [];

        window.onload = function() {
            cargarAnuncios();
        };

        function cargarAnuncios() {
            db.collection("ads").orderBy("createdAt", "desc").onSnapshot(snapshot => {
                anunciosTotales = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.titulo) {
                        anunciosTotales.push({ id: doc.id, ...data });
                    }
                });
                renderizarTarjetas(anunciosTotales);
            }, error => {
                console.error("Error al cargar de Firestore:", error);
                document.getElementById('cardsGrid').innerHTML = '<p>Error al conectar con la base de datos.</p>';
            });
        }

        function renderizarTarjetas(lista) {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            if (lista.length === 0) {
                grid.innerHTML = '<p>No hay anuncios publicados en esta categoría todavía.</p>';
                return;
            }

            lista.forEach(ad => {
                const foto = (ad.fotos && ad.fotos.length > 0) 
                    ? ad.fotos[0] 
                    : 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=500&q=80';

                const cardHTML = `
                    <article class="card">
                        <div class="card-img-wrapper">
                            <img src="${foto}" class="card-img">
                        </div>
                        <div class="card-body">
                            <h3 class="card-title">${ad.titulo}</h3>
                            <div class="card-price">${ad.precio}</div>
                            <div class="card-location">📍 ${ad.ubicacion} ${ad.subcategoria ? '• ' + ad.subcategoria : ''}</div>
                        </div>
                        <div class="card-footer">
                            <button class="btn-block" onclick='verDetalle("${encodeURIComponent(ad.titulo)}", "${encodeURIComponent(ad.precio)}", "${encodeURIComponent(ad.ubicacion)}", "${encodeURIComponent(ad.categoria)}", "${encodeURIComponent(ad.descripcion || "Sin descripción")}", "${encodeURIComponent(foto)}")'>Ver Detalle</button>
                        </div>
                    </article>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        function toggleCategoria(elemento, catNombre) {
            // Cierra las demás y abre la actual o viceversa
            const grupo = elemento.parentElement;
            const isOpen = grupo.classList.contains('open');
            
            document.querySelectorAll('.category-group').forEach(el => el.classList.remove('open'));
            
            if (!isOpen) {
                grupo.classList.add('open');
            }

            filtrarCategoria(catNombre, elemento);
        }

        function filtrarCategoria(cat, elemento) {
            document.querySelectorAll('.dept-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sub-item').forEach(el => el.classList.remove('active'));
            if(elemento) elemento.classList.add('active');
            
            document.getElementById('feedTitle').innerText = cat === 'Todos' ? 'Explorando Anuncios' : cat;

            if (cat === 'Todos') {
                renderizarTarjetas(anunciosTotales);
            } else {
                const filtrados = anunciosTotales.filter(ad => ad.categoria === cat);
                renderizarTarjetas(filtrados);
            }
        }

        function filtrarSub(subcat, elemento) {
            document.querySelectorAll('.sub-item').forEach(el => el.classList.remove('active'));
            elemento.classList.add('active');
            document.getElementById('feedTitle').innerText = subcat;

            const filtrados = anunciosTotales.filter(ad => ad.subcategoria === subcat);
            renderizarTarjetas(filtrados);
        }

        async function guardarAnuncio(e) {
            e.preventDefault();
            const btn = document.getElementById('btnGuardar');
            btn.innerText = 'Subiendo anuncio...';
            btn.disabled = true;

            const titulo = document.getElementById('titulo').value;
            const categoria = document.getElementById('categoria').value;
            const subcategoria = document.getElementById('subcategoria').value;
            const precio = document.getElementById('precio').value;
            const ubicacion = document.getElementById('ubicacion').value;
            const descripcion = document.getElementById('descripcion').value;
            const archivoInput = document.getElementById('fotos');

            let fotosURLs = [];

            try {
                if (archivoInput.files && archivoInput.files[0]) {
                    const file = archivoInput.files[0];
                    const base64 = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (evt) => resolve(evt.target.result);
                        reader.readAsDataURL(file);
                    });
                    fotosURLs.push(base64);
                } else {
                    fotosURLs.push('https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=500&q=80');
                }

                await db.collection("ads").add({
                    titulo,
                    categoria,
                    subcategoria,
                    precio,
                    ubicacion,
                    descripcion,
                    fotos: fotosURLs,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("¡Anuncio publicado con éxito!");
                document.getElementById('formPublicar').reset();
                cerrarModal();
            } catch (err) {
                console.error("Error al publicar:", err);
                alert("Ocurrió un error al subir el anuncio.");
            } finally {
                btn.innerText = 'Publicar Anuncio';
                btn.disabled = false;
            }
        }

        function verDetalle(titulo, precio, ubicacion, categoria, descripcion, foto) {
            const modalHTML = `
                <div class="modal-overlay active" id="modalDetalle" onclick="if(event.target === this) cerrarDetalle()">
                    <div class="modal-card">
                        <button class="close-btn" onclick="cerrarDetalle()">&times;</button>
                        <h2 style="margin-bottom: 1rem; color: var(--primary-color);">${decodeURIComponent(titulo)}</h2>
                        <img src="${decodeURIComponent(foto)}" style="width: 100%; height: 200px; object-fit: cover; border-radius: 6px; margin-bottom: 1rem;">
                        <p style="font-size: 1.2rem; font-weight: bold; color: var(--primary-color); margin-bottom: 0.5rem;">${decodeURIComponent(precio)}</p>
                        <p style="color: var(--gray); font-size: 0.9rem; margin-bottom: 0.5rem;">📍 <strong>Ubicación:</strong> ${decodeURIComponent(ubicacion)}</p>
                        <p style="color: var(--gray); font-size: 0.9rem; margin-bottom: 1rem;">📂 <strong>Categoría:</strong> ${decodeURIComponent(categoria)}</p>
                        <hr style="border: none; border-top: 1px solid var(--light-gray); margin-bottom: 1rem;">
                        <p style="white-space: pre-wrap; font-size: 0.95rem;">${decodeURIComponent(descripcion)}</p>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHTML);
        }

        function cerrarDetalle() {
            const modal = document.getElementById('modalDetalle');
            if (modal) modal.remove();
        }

        function abrirModal() { document.getElementById('publishModal').classList.add('active'); }
        function cerrarModal() { document.getElementById('publishModal').classList.remove('active'); }
        function actualizarSubcategoriasForm() { /* Opcional para lógica de autocompletado futura */ }
    </script>
</body>
</html>
