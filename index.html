<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coquí Ventas - Mercado y Empleos en Puerto Rico</title>

  <!-- Firebase App, Firestore y Auth SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBjLJnC7EGKXdCwc-VmIbXgckSdcaj3FhE",
      authDomain: "coqui-ventas.firebaseapp.com",
      projectId: "coqui-ventas",
      storageBucket: "coqui-ventas.firebasestorage.app",
      messagingSenderId: "425636251347",
      appId: "1:425636251347:web:b96972a26fba7777e6f626",
      measurementId: "G-BZJ2BZLRMS"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
  </script>

  <style>
    :root {
      --brand-green-coqui: #2D5A27;
      --brand-green-light: #4A8539;
      --brand-terracotta:  #C85A32;
      --bg-light:          #FAFAF7;
      --text-primary:      #1A201C;
      --text-muted:        #5A655D;
      --border-color:      #E2E8E4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-light); color: var(--text-primary); }

    .navbar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 0.8rem 2rem; 
      background: #fff; 
      border-bottom: 1px solid var(--border-color); 
    }
    .logo img { height: 45px; vertical-align: middle; }
    .nav-actions { display: flex; align-items: center; gap: 0.8rem; }

    .btn-primary { background: var(--brand-green-coqui); color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-primary:hover { background: var(--brand-green-light); }
    .btn-secondary { background: transparent; border: 1px solid var(--border-color); padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; }
    .btn-google { background: #4285F4; color: white; border: none; padding: 0.8rem; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 0.5rem; }

    .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    .hero { text-align: center; padding: 2.5rem 1rem; background: #fff; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 2rem; }
    
    .section-title { font-size: 1.4rem; color: var(--brand-green-coqui); margin-bottom: 1rem; }
    .listings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; }
    
    .card-item { 
      background: #fff; 
      border-radius: 12px; 
      border: 1px solid var(--border-color); 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
      padding: 1rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card-item:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
    .card-img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 0.8rem; background-color: #f0f0f0; }
    .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: bold; margin-bottom: 0.5rem; background: #E8F5E9; color: var(--brand-green-coqui); width: fit-content; }
    .card-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 0.4rem; }
    .card-price { font-size: 1.2rem; font-weight: bold; color: var(--brand-terracotta); margin-bottom: 0.4rem; }
    .card-location { font-size: 0.85rem; color: var(--text-muted); }
    .card-user { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem; font-style: italic; }

    /* Modales */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); justify-content: center; align-items: center; z-index: 1000; padding: 1rem; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: #fff; width: 100%; max-width: 450px; border-radius: 16px; padding: 2rem; position: relative; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; font-weight: 600; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit; }
    .form-group textarea { resize: vertical; min-height: 80px; }
  </style>
</head>
<body>

  <header class="navbar">
    <a href="#" class="logo">
      <img src="logo.png" alt="Coquí Ventas">
    </a>
    <div class="nav-actions">
      <span id="userGreeting" style="display:none; font-weight:600; font-size:0.9rem; color: var(--brand-green-coqui);"></span>
      <button class="btn-secondary" id="btnLogin">Iniciar Sesión</button>
      <button class="btn-secondary" id="btnLogout" style="display:none;">Cerrar Sesión</button>
      <button class="btn-primary" id="btnOpenPublish">+ Publicar Anuncio</button>
    </div>
  </header>

  <main class="container">
    <div class="hero">
      <h1>El Mercado Digital de Puerto Rico</h1>
      <p style="color: var(--text-muted); margin-top: 0.5rem;">Conéctate con compradores y vendedores locales en los 78 municipios.</p>
    </div>

    <h2 class="section-title">Anuncios Recientes</h2>
    <section class="listings-grid" id="listingsContainer">
      <p id="loadingMsg" style="color: var(--text-muted);">Cargando publicaciones...</p>
    </section>
  </main>

  <!-- Modal Auth -->
  <div class="modal-overlay" id="modalAuth">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="authTitle">Iniciar Sesión</h3>
        <button class="close-btn" id="btnCloseAuth">&times;</button>
      </div>
      <form id="authForm">
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" id="authEmail" required />
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="authPassword" required />
        </div>
        <button type="submit" class="btn-primary" style="width:100%;">Entrar / Registrarme</button>
      </form>
      <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid var(--border-color);">
      <button class="btn-google" id="btnGoogleLogin">Continuar con Google</button>
    </div>
  </div>

  <!-- Modal Publicar Anuncio -->
  <div class="modal-overlay" id="modalPublish">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Publicar Nuevo Anuncio</h3>
        <button class="close-btn" id="btnClosePublish">&times;</button>
      </div>
      <form id="publishForm">
        <div class="form-group">
          <label for="category">Categoría</label>
          <select id="category" required>
            <option value="">Selecciona una categoría</option>
            <option value="Agro">🌾 Mercado Agrícola</option>
            <option value="Mascotas">🐾 Mascotas en Adopción (Gratis)</option>
            <option value="Empleos">💼 Empleo / Trabajo</option>
            <option value="Clasificados">📦 Clasificados Generales</option>
          </select>
        </div>
        <div class="form-group">
          <label for="title">Título del Anuncio</label>
          <input type="text" id="title" placeholder="Ej. Plátanos verdes, Oferta de trabajo..." required />
        </div>
        <div class="form-group">
          <label for="price">Precio ($) o Salario / Estado</label>
          <input type="text" id="price" placeholder="Ej. 25.00, Gratis, $15/hr" required />
        </div>
        <div class="form-group">
          <label for="town">Pueblo</label>
          <select id="town" required>
            <option value="">Selecciona tu pueblo</option>
          </select>
        </div>
        <div class="form-group">
          <label for="phone">Teléfono / WhatsApp de contacto</label>
          <input type="tel" id="phone" placeholder="Ej. 7875551234" required />
        </div>
        <div class="form-group">
          <label for="imageInput">Foto del producto / anuncio</label>
          <input type="file" id="imageInput" accept="image/*" />
        </div>
        <div class="form-group">
          <label for="description">Descripción</label>
          <textarea id="description" placeholder="Escribe los detalles de tu anuncio..."></textarea>
        </div>
        <button type="submit" class="btn-primary" style="width:100%;" id="btnSubmitForm">Publicar Anuncio</button>
      </form>
    </div>
  </div>

  <script>
    const municipiosPR = [
      "Adjuntas", "Aguada", "Aguadilla", "Aguas Buenas", "Aibonito", "Añasco", "Arecibo", "Arroyo",
      "Barceloneta", "Barranquitas", "Bayamón", "Cabo Rojo", "Caguas", "Camuy", "Canóvanas", "Carolina",
      "Cataño", "Cayey", "Ceiba", "Ciales", "Cidra", "Coamo", "Comerío", "Corozal", "Culebra", "Dorado",
      "Fajardo", "Florida", "Guánica", "Guayama", "Guayanilla", "Guaynabo", "Gurabo", "Hatillo", "Hormigueros",
      "Humacao", "Isabela", "Jayuya", "Juana Díaz", "Juncos", "Lajas", "Lares", "Las Marías", "Las Piedras",
      "Loíza", "Luquillo", "Manatí", "Maricao", "Maunabo", "Mayagüez", "Moca", "Morovis", "Naguabo", "Naranjito",
      "Orocovis", "Patillas", "Peñuelas", "Ponce", "Quebradillas", "Rincón", "Río Grande", "Sabana Grande",
      "Salinas", "San Germán", "San Juan", "San Lorenzo", "San Sebastián", "Santa Isabel", "Toa Alta",
      "Toa Baja", "Trujillo Alto", "Utuado", "Vega Alta", "Vega Baja", "Vieques", "Villalba", "Yabucoa", "Yauco"
    ];

    const townSelect = document.getElementById('town');
    municipiosPR.forEach(pueblo => {
      townSelect.innerHTML += `<option value="${pueblo}">${pueblo}</option>`;
    });

    const modalAuth = document.getElementById('modalAuth');
    const modalPublish = document.getElementById('modalPublish');
    const btnLogin = document.getElementById('btnLogin');
    const btnLogout = document.getElementById('btnLogout');
    const btnOpenPublish = document.getElementById('btnOpenPublish');
    const btnCloseAuth = document.getElementById('btnCloseAuth');
    const btnClosePublish = document.getElementById('btnClosePublish');
    const userGreeting = document.getElementById('userGreeting');

    let currentUser = null;

    btnLogin.addEventListener('click', () => modalAuth.classList.add('active'));
    btnCloseAuth.addEventListener('click', () => modalAuth.classList.remove('active'));
    
    btnOpenPublish.addEventListener('click', () => {
      if (!currentUser) {
        alert('Debes iniciar sesión para poder publicar un anuncio.');
        modalAuth.classList.add('active');
      } else {
        modalPublish.classList.add('active');
      }
    });
    btnClosePublish.addEventListener('click', () => modalPublish.classList.remove('active'));

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const pass = document.getElementById('authPassword').value;

      try {
        await auth.signInWithEmailAndPassword(email, pass);
        modalAuth.classList.remove('active');
      } catch (err) {
        if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
          try {
            await auth.createUserWithEmailAndPassword(email, pass);
            modalAuth.classList.remove('active');
          } catch (createErr) {
            alert('Error al registrar cuenta: ' + createErr.message);
          }
        } else {
          alert('Error: ' + err.message);
        }
      }
    });

    document.getElementById('btnGoogleLogin').addEventListener('click', async () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        await auth.signInWithPopup(provider);
        modalAuth.classList.remove('active');
      } catch (err) {
        alert('Error con Google: ' + err.message);
      }
    });

    btnLogout.addEventListener('click', () => auth.signOut());

    auth.onAuthStateChanged((user) => {
      currentUser = user;
      if (user) {
        userGreeting.textContent = `Hola, ${user.displayName || user.email.split('@')[0]}`;
        userGreeting.style.display = 'inline';
        btnLogin.style.display = 'none';
        btnLogout.style.display = 'inline-block';
      } else {
        userGreeting.style.display = 'none';
        btnLogin.style.display = 'inline-block';
        btnLogout.style.display = 'none';
      }
    });

    // Función para subir imagen a ImgBB
    async function uploadImageToImgBB(file) {
      const apiKey = '287e6fe89fd5baeabb22b2c257c3bb7b';
      const formData = new FormData();
      formData.append('image', file);

      const response = await fetch(`https://api.imgbb.com/1/upload?key=${apiKey}`, {
        method: 'POST',
        body: formData
      });

      const data = await response.json();

      if (!data.success) {
        throw new Error('Error de ImgBB: ' + (data.error ? data.error.message : 'No se pudo subir la imagen'));
      }

      return data.data.url;
    }

    const publishForm = document.getElementById('publishForm');
    publishForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const btnSubmit = document.getElementById('btnSubmitForm');
      btnSubmit.textContent = 'Subiendo imagen y datos...';
      btnSubmit.disabled = true;

      try {
        const imageFile = document.getElementById('imageInput').files[0];
        let imageUrl = '';

        if (imageFile) {
          imageUrl = await uploadImageToImgBB(imageFile);
        }

        const newListing = {
          category: document.getElementById('category').value,
          title: document.getElementById('title').value,
          price: document.getElementById('price').value,
          town: document.getElementById('town').value,
          phone: document.getElementById('phone').value,
          description: document.getElementById('description').value,
          imageUrl: imageUrl,
          userId: currentUser.uid,
          userEmail: currentUser.email,
          createdAt: new Date()
        };

        await db.collection('anuncios').add(newListing);
        alert('¡Anuncio publicado con éxito!');
        modalPublish.classList.remove('active');
        publishForm.reset();
        loadListings();
      } catch (err) {
        alert('Error al publicar: ' + err.message);
      } finally {
        btnSubmit.textContent = 'Publicar Anuncio';
        btnSubmit.disabled = false;
      }
    });

    async function loadListings() {
      const container = document.getElementById('listingsContainer');
      try {
        const snapshot = await db.collection('anuncios').get();
        if (snapshot.empty) {
          container.innerHTML = '<p style="color: var(--text-muted);">Aún no hay anuncios publicados. ¡Sé el primero en publicar!</p>';
          return;
        }

        container.innerHTML = '';
        snapshot.forEach((doc) => {
          const item = doc.data();
          const imgTag = item.imageUrl 
            ? `<img src="${item.imageUrl}" alt="${item.title}" class="card-img">`
            : `<div class="card-img" style="display:flex;align-items:center;justify-content:center;color:#aaa;">Sin imagen</div>`;

          const cardHTML = `
            <article class="card-item">
              ${imgTag}
              <span class="badge">${item.category || 'General'}</span>
              <div class="card-title">${item.title}</div>
              <div class="card-price">${item.price}</div>
              <div class="card-location">📍 ${item.town}, PR</div>
              <p style="font-size: 0.85rem; margin-top: 0.5rem;">${item.description || ''}</p>
              <div class="card-user">Publicado por: ${item.userEmail ? item.userEmail.split('@')[0] : 'Anónimo'}</div>
            </article>
          `;
          container.innerHTML += cardHTML;
        });
      } catch (err) {
        console.error('Error al cargar anuncios:', err);
        container.innerHTML = '<p style="color: red;">Error al cargar anuncios.</p>';
      }
    }

    loadListings();
  </script>
</body>
</html>
